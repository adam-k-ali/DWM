---
name: Assert and Click
type: command
---
parameters:
  - name: "name"
    type: string
    description: "The name of the element to assert and click"
  - name: "type"
    type: string
    description: "The type of the element to assert and click"

steps:
  - assertVisible:
    - type: "{{ type }}"
      name: "{{ name }}"
  - click:
    - type: "{{ type }}"
      name: "{{ name }}"
