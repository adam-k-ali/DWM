plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.sightline_version
group = project.sightline_maven_group

base {
    archivesName = 'sightline-fabric'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "org.yaml:snakeyaml:2.6"
    include "org.yaml:snakeyaml:2.6"
}

loom {
    accessWidenerPath = file('src/main/resources/sightline.accesswidener')

    mods {
        sightline {
            sourceSet sourceSets.main
        }
    }
}

// Embed common sources so consumers depend on a single loader artifact.
sourceSets.main {
    java {
        srcDir project(':sightline-common').file('src/main/java')
    }
    resources {
        srcDir project(':sightline-common').file('src/main/resources')
    }
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_sightline" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'sightline-fabric'
            from components.java
        }
    }
    repositories {
    }
}
