---
name: Sonic TARDIS Ping
type: test
---
steps:
  - launchGame
  - claimPlacedTardis
  - runCommand: "/item replace entity @s weapon.mainhand with dwm:sonic_third_doctor"
  - waitUntil:
      holding: dwm:sonic_third_doctor
  - setSneaking:
      enabled: true
  - waitTicks: 2
  - useItem: air
  - waitTicks: 2
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - setSneaking:
      enabled: false
  - waitUntil:
      overlay: "Setting: Ping"
  - useItem: air
  - waitUntil:
      overlay: "cloak not engaged"
  - lookAt:
      x: "~1"
      y: "~"
      z: "~"
  - waitTicks: 5
  - walkUntil:
      dimension: dwm:tardis
  - waitTicks: 40
  # Entrance is 5 blocks north of the console. Stand on the north floor tile
  # (same idea as installConsoleCircuit's south-face tp) so nearest+index 0 is
  # Panel4 cloak, not a farther control from spawn.
  - runCommand: "/tp @s ~ ~ ~4"
  - waitTicks: 5
  - setSneaking:
      enabled: false
  - selectHotbar: 0
  - lookAt:
      x: "~"
      y: "~1"
      z: "~1"
  - waitTicks: 10
  - interactWithEntity:
      type: dwm:console_control
      mode: nearest
      maxDistance: 4
      near:
        x: "~"
        y: "~1"
        z: "~"
      index: 0
  - waitUntil:
      overlay: "Cloak engaged"
  - selectHotbar: 1
  - waitTicks: 5
  - runCommand: "/tp @s ~ ~ ~-4"
  - lookAt:
      x: "~"
      y: "~1"
      z: "~-1"
  - waitTicks: 5
  - walkUntil:
      dimension: minecraft:overworld
  - waitTicks: 20
  - useItem: air
  - waitUntil:
      overlay: "TARDIS located"
