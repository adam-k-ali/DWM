---
name: Field Guide Console Circuits
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  # Hide HUD + first-person hand/skin so CI compares the guide pages, not
  # player chrome (default skins differ across runs).
  - pressKey: f1
  - waitTicks: 2
  - assertAndClick:
      type: button
      name: "Console Circuits"
  - waitUntil:
      visible:
        type: label
        name: "Fitting a Circuit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-install
  - assertAndClick:
      type: button
      name: "Landing Kit"
  - waitUntil:
      visible:
        type: label
        name: "Landing Kit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-landing-kit-nohud
      compare: true
      maxDiffPixels: 50
  # Landing Kit is one visual slice; Next Page is the dedicated turn control
  # (left-index "Planet Locator" can miss when another active widget overlaps).
  - assertAndClick:
      type: button
      name: "Next Page"
  - waitUntil:
      visible:
        type: label
        name: "Planet Locator"
  - waitTicks: 10
  - captureScreenshot:
      name: field-guide-circuits-planet-locator-nohud
      compare: true
      maxDiffPixels: 50
  - assertAndClick:
      type: button
      name: "Next Page"
  - waitUntil:
      visible:
        type: label
        name: "Late Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-nohud
      compare: true
  - assertAndClick:
      type: button
      name: "Zeiton"
  - waitTicks: 10
  - captureScreenshot:
      name: field-guide-circuits-late-zeiton-nohud
      compare: true
  - assertAndClick:
      type: button
      name: "Next Page"
  - waitTicks: 10
  - captureScreenshot:
      name: field-guide-circuits-late-continued-nohud
      compare: true
      maxDiffPixels: 50
