---
name: Field Guide Console Circuits
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  - assertAndClick:
      type: button
      name: "Console Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-install
  - assertAndClick:
      type: button
      name: "Landing Kit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-landing-kit
  - assertAndClick:
      type: button
      name: "Planet Locator"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-planet-locator
  - assertAndClick:
      type: button
      name: "Late Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late
  - assertAndClick:
      type: button
      name: "Zeiton"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-zeiton
  - assertAndClick:
      type: button
      name: "Next Page"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-continued
