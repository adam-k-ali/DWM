---
name: Field Guide Console Circuits
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  # Hide first-person hand so CI compare is the book, not arm chrome.
  - pressKey: f1
  - waitTicks: 2
  - assertAndClick:
      type: button
      name: "Console Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-install
  - assertAndClick:
      type: button
      name: "Landing Kit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-landing-kit
      compare: true
  - assertAndClick:
      type: button
      name: "Planet Locator"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-planet-locator
      compare: true
  - assertAndClick:
      type: button
      name: "Late Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late
      compare: true
