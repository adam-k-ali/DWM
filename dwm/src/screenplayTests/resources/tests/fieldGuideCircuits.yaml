---
name: Field Guide Console Circuits
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  # Hide first-person hand. Main goldens still include arm chrome, so these
  # captures stay compare-off until a green main run stores no-HUD shots.
  - pressKey: f1
  - waitTicks: 2
  - assertAndClick:
      type: button
      name: "Console Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-install
  - assertAndClick:
      type: button
      name: "Landing Kit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-landing-kit
  - assertAndClick:
      type: button
      name: "Planet Locator"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-planet-locator
  - assertAndClick:
      type: button
      name: "Late Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late
