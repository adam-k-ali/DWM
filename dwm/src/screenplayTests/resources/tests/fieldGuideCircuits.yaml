---
name: Field Guide Console Circuits
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  # Hide HUD + first-person hand/skin so CI compares the guide pages, not
  # player chrome (default skins differ across runs). New stem → NO BASELINE on
  # this PR; green main establishes the no-HUD goldens afterward.
  - pressKey: f1
  - waitTicks: 2
  - assertAndClick:
      type: button
      name: "Console Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-install
  - assertAndClick:
      type: button
      name: "Landing Kit"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-landing-kit-nohud
      compare: true
      maxDiffPixels: 50
  - assertAndClick:
      type: button
      name: "Planet Locator"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-planet-locator-nohud
      compare: true
      maxDiffPixels: 50
  - assertAndClick:
      type: button
      name: "Late Circuits"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-nohud
      compare: true
  - assertAndClick:
      type: button
      name: "Zeiton"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-zeiton-nohud
      compare: true
  - assertAndClick:
      type: button
      name: "Next Page"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-circuits-late-continued-nohud
      compare: true
      maxDiffPixels: 50
