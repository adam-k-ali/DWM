---
name: Field Guide
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
  - closeScreen
  - pressKey: g
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  - captureScreenshot:
      name: field-guide-default
  - assertAndClick:
      type: button
      name: "Console Room Builder"
  - assertAndClick:
      type: button
      name: "TARDIS Wall"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-console-room
  - assertAndClick:
      type: button
      name: "Chronoplasm Powder"
  - waitTicks: 5
  - captureScreenshot:
      name: field-guide-chronoplasm-recipe
  - closeScreen
  - selectHotbar: 0
  - waitUntil:
      holding: dwm:field_guide
  - useItem: air
  - waitUntil:
      visible:
        type: screen
        name: FieldGuideScreen
  - captureScreenshot:
      name: field-guide-via-item
