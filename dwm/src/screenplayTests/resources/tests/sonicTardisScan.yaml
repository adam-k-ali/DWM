---
name: Sonic TARDIS Scan
type: test
---
steps:
  - launchGame
  - claimPlacedTardis
  - runCommand: "/item replace entity @s weapon.mainhand with dwm:sonic_third_doctor"
  - waitUntil:
      holding: dwm:sonic_third_doctor
  - setSneaking:
      enabled: true
  - waitTicks: 2
  - useItem: air
  - waitTicks: 2
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - pressKey: right
  - setSneaking:
      enabled: false
  - waitUntil:
      overlay: "Setting: Scan"
  - lookAt:
      x: "~1"
      y: "~"
      z: "~"
  - waitTicks: 5
  - useItem
  - waitTicks: 5
