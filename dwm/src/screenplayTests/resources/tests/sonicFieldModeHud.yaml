---
name: Sonic Field Mode HUD
type: test
---
steps:
  - launchGame
  - createWorld:
      worldType: superflat
      gameMode: creative
      difficulty: peaceful
      allowCommands: true
      name: Sonic HUD
  - closeScreen
  - runCommand: "/time set noon"
  - runCommand: "/weather clear"
  - runCommand: "/give @s dwm:sonic_third_doctor"
  - waitUntil:
      holding: dwm:sonic_third_doctor
  - selectHotbar: 0
  - lookAt:
      yaw: 0
      pitch: -25
  - waitTicks: 220
  # In-world sky shots are not pixel-stable on CI xvfb/llvmpipe (clouds and
  # first-person rendering). Keep captures for artifacts; skip baseline compare.
  - captureScreenshot:
      name: sonic-field-mode-indicator
  - setSneaking:
      enabled: true
  - waitTicks: 2
  - useItem: air
  - waitTicks: 5
  - captureScreenshot:
      name: sonic-field-mode-carousel
  - pressKey: right
  - waitTicks: 2
  - captureScreenshot:
      name: sonic-field-mode-carousel-eight-slots
  - setSneaking:
      enabled: false
  - waitTicks: 2
