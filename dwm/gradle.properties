# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Maven resilience: retry (with backoff) on 429/5xx from shared-egress cloud sessions.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
# Fabric Properties — keep aligned with ../gradle/libs.versions.toml
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.21
# Mod Properties
mod_version=1.8.0
maven_group=com.adamkali.dwm
archives_base_name=dwm
# Dependencies
fabric_version=0.156.0+26.2
modmenu_version=20.0.1
cloth_config_version=26.2.155
