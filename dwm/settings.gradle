pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	includeBuild('../screenplay/gradle-plugin')
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
	versionCatalogs {
		libs {
			from(files('../gradle/libs.versions.toml'))
		}
	}
}

// Composite build: substitute Screenplay Fabric coords with the sibling Gradle project.
includeBuild('../screenplay') {
	dependencySubstitution {
		substitute module('com.adamkali.screenplay:screenplay-fabric') using project(':')
	}
}

rootProject.name = 'dwm'
