---
name: Join Vanilla Server
type: test
# Vanilla dedicated servers reject Forge/NeoForge clients that require those loaders.
loaders: [fabric]
---
steps:
  - launchGame
  - startVanillaServer
  - assertAndClick:
    - type: button
      name: "Multiplayer"
  - assertAndClick:
    - type: button
      name: "Direct Connection"
  - assertAndClick:
    - type: editbox
      name: "Server Address"
  - keyboardInput: "127.0.0.1:25565"
  - assertAndClick:
    - type: button
      name: "Join Server"
  - assertVisible:
    - type: screen
      name: LevelLoadingScreen
  - waitUntil:
      notVisible:
        type: screen
        name: LevelLoadingScreen
  - openInventory
  - debugScreen
  - captureScreenshot
