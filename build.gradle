plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    // Prefer Modrinth: Terraformers Maven is intermittently unavailable (502/timeouts).
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "com.terraformersmc"
        }
    }
}

sourceSets {
    scenarioTest
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = file("src/main/resources/dwm.accesswidener")

    mods {
        "dwm" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "dwm-scenario-test" {
            sourceSet sourceSets.scenarioTest
        }
    }

    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest/report.xml"
            runDir "build/gametest"
        }
        scenarioTest {
            client()
            name "Scenario Test"
            source = sourceSets.scenarioTest
            property "dwm.scenario", providers.gradleProperty("scenario").orElse("createWorld").get()
            property "dwm.scenario.step-timeout-seconds",
                    providers.gradleProperty("scenarioTimeout").orElse("30").get()
            property "dwm.scenario.report-file",
                    layout.buildDirectory.file("scenario-test/report.xml").get().asFile.absolutePath
            property "dwm.scenario.vanilla-server-dir",
                    layout.buildDirectory.dir("scenario-test/vanilla-server").get().asFile.absolutePath
            runDir "build/scenario-test/run"
        }
    }
}

sourceSets.scenarioTest {
    compileClasspath += sourceSets.main.output
    compileClasspath += sourceSets.client.output
    compileClasspath += sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.runtimeClasspath
}

def scenarioDisplayMode = providers.gradleProperty("scenarioDisplay").orElse("display")

tasks.register("prepareScenarioTestRun") {
    def optionsFile = layout.buildDirectory.file("scenario-test/run/options.txt")
    def vanillaServerDir = layout.buildDirectory.dir("scenario-test/vanilla-server")
    def jarPathFile = layout.buildDirectory.file("scenario-test/vanilla-server/server-jar.path")
    def displayMode = scenarioDisplayMode
    outputs.file(optionsFile)
    outputs.file(jarPathFile)
    outputs.upToDateWhen { false }
    doLast {
        delete(layout.buildDirectory.dir("scenario-test/run/saves"))
        delete(layout.buildDirectory.dir("scenario-test/vanilla-server/world"))
        optionsFile.get().asFile.parentFile.mkdirs()
        def mode = displayMode.get()
        def options = new StringBuilder("""\
lang:en_us
skipMultiplayerWarning:true
onboardAccessibility:false
""")
        if (mode == "xvfb") {
            // Soft-GL friendly defaults for CI / headless virtual displays.
            options.append("""\
fullscreen:false
renderDistance:4
simulationDistance:4
maxFps:30
enableVsync:false
guiScale:1
""")
        }
        optionsFile.get().asFile.text = options.toString()
        def serverDir = vanillaServerDir.get().asFile
        serverDir.mkdirs()
        def serverJar = net.fabricmc.loom.LoomGradleExtension.get(project).minecraftProvider.minecraftServerJar
        jarPathFile.get().asFile.text = serverJar.absolutePath
    }
}

tasks.named("runScenarioTest").configure {
    dependsOn("prepareScenarioTestRun")

    def mode = scenarioDisplayMode.get()
    if (!(mode in ["display", "xvfb"])) {
        throw new GradleException(
                "Invalid -PscenarioDisplay='${mode}'. Allowed values: display, xvfb.")
    }

    // Override Loom's CI-env convention so the CLI flag is authoritative.
    useXvfb = (mode == "xvfb")

    if (mode == "xvfb") {
        environment "LIBGL_ALWAYS_SOFTWARE", "1"
    }

    doFirst {
        def currentMode = scenarioDisplayMode.get()
        def linux = org.gradle.internal.os.OperatingSystem.current().isLinux()
        if (currentMode == "display") {
            def display = System.getenv("DISPLAY")
            if (linux && (display == null || display.isBlank())) {
                throw new GradleException(
                        "scenarioDisplay=display requires \$DISPLAY. "
                                + "Use -PscenarioDisplay=xvfb for headless/CI runs.")
            }
        } else if (currentMode == "xvfb") {
            if (!linux) {
                throw new GradleException("scenarioDisplay=xvfb is only supported on Linux.")
            }
            def which = new ProcessBuilder("which", "xvfb-run")
                    .redirectErrorStream(true)
                    .start()
            which.waitFor()
            if (which.exitValue() != 0) {
                throw new GradleException(
                        "scenarioDisplay=xvfb requires xvfb-run on PATH. "
                                + "Install with: apt install xvfb")
            }
        }
    }
}

def scenarioTestsRoot = file("src/scenarioTest/resources/tests")

def isScenarioTestYaml = { File yamlFile ->
    def text = yamlFile.getText("UTF-8").replace("\r\n", "\n")
    if (!text.startsWith("---\n")) {
        return false
    }
    def closing = text.indexOf("\n---\n", 4)
    if (closing < 0) {
        return false
    }
    return text.substring(4, closing).readLines().any { line ->
        line.trim() == "type: test"
    }
}

def discoverScenarioTestIds = {
    if (!scenarioTestsRoot.isDirectory()) {
        throw new GradleException("Scenario tests directory not found: ${scenarioTestsRoot}")
    }
    def ids = [] as TreeSet
    fileTree(dir: scenarioTestsRoot, includes: ["**/*.yaml", "**/*.yml"]).files.each { File yamlFile ->
        if (!isScenarioTestYaml(yamlFile)) {
            return
        }
        def name = yamlFile.name
        def extension = name.lastIndexOf('.')
        def id = extension < 0 ? name : name.substring(0, extension)
        if (!ids.add(id)) {
            throw new GradleException("Duplicate scenario test id '${id}' under ${scenarioTestsRoot}")
        }
    }
    return ids as List
}

interface ScenarioTestExecOps {
    @javax.inject.Inject
    org.gradle.process.ExecOperations getExecOps()
}

def scenarioTestExecOps = objects.newInstance(ScenarioTestExecOps)

tasks.register("runAllScenarioTests") {
    group = "verification"
    description = "Discover all type:test YAML scenarios and run each via runScenarioTest"

    def displayMode = scenarioDisplayMode
    def timeoutProperty = providers.gradleProperty("scenarioTimeout")
    def projectDirFile = layout.projectDirectory.asFile
    def resultsRoot = layout.buildDirectory.dir("scenario-test/results")
    def execOps = scenarioTestExecOps.execOps

    doLast {
        def scenarioIds = discoverScenarioTestIds()
        if (scenarioIds.isEmpty()) {
            throw new GradleException("No scenario tests (type: test) found under ${scenarioTestsRoot}")
        }

        logger.lifecycle("Discovered ${scenarioIds.size()} scenario test(s): ${scenarioIds.join(', ')}")

        def gradleWrapper = new File(projectDirFile, "gradlew")
        def gradleCommand = gradleWrapper.exists() ? gradleWrapper.absolutePath : "gradle"
        def failed = []
        def resultsDir = resultsRoot.get().asFile
        project.delete(resultsDir)
        resultsDir.mkdirs()

        scenarioIds.each { String scenarioId ->
            logger.lifecycle("Running scenario test '${scenarioId}'")
            def args = [gradleCommand, "runScenarioTest", "-Pscenario=${scenarioId}"]
            args << "-PscenarioDisplay=${displayMode.get()}"
            if (timeoutProperty.isPresent()) {
                args << "-PscenarioTimeout=${timeoutProperty.get()}"
            }
            def result = execOps.exec {
                workingDir projectDirFile
                commandLine args
                ignoreExitValue = true
            }

            def archiveDir = new File(resultsDir, scenarioId)
            archiveDir.mkdirs()
            ["report.xml", "metrics.json", "diagnostics.txt"].each { String fileName ->
                def source = new File(projectDirFile, "build/scenario-test/${fileName}")
                if (source.isFile()) {
                    project.copy {
                        from source
                        into archiveDir
                    }
                }
            }
            def screenshots = new File(projectDirFile, "build/scenario-test/run/screenshots")
            if (screenshots.isDirectory()) {
                project.copy {
                    from screenshots
                    into new File(archiveDir, "screenshots")
                }
            }

            if (result.exitValue != 0) {
                failed << scenarioId
                logger.error("Scenario test '${scenarioId}' failed (exit ${result.exitValue})")
            } else {
                logger.lifecycle("Scenario test '${scenarioId}' passed")
            }
        }

        if (!failed.isEmpty()) {
            throw new GradleException(
                    "Failed scenario test(s): ${failed.join(', ')} "
                            + "(${failed.size()} of ${scenarioIds.size()})")
        }
        logger.lifecycle("All ${scenarioIds.size()} scenario test(s) passed")
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    // 5.18+ bundles Byte Buddy with Java 25 classfile support (mockStatic / inline mocks)
    testImplementation "org.mockito:mockito-core:5.20.0"
    testImplementation sourceSets.scenarioTest.output
    testImplementation "org.yaml:snakeyaml:2.6"
    scenarioTestImplementation "org.yaml:snakeyaml:2.6"

    implementation "org.json:json:20240303"
    implementation "com.github.erosb:everit-json-schema:1.14.4"

    implementation("maven.modrinth:modmenu:${project.modmenu_version}")
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation("com.mixpanel:mixpanel-java:1.5.1")

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def versionJsonFile = file("version.json")

/**
 * Rewrites version.json promos from gradle.properties and stubs an empty changelog
 * section for the current mod_version when missing (summary + added/changed/removed).
 * Changelog bullets and summary stay hand-written.
 * Run after bumping mod_version / minecraft_version: ./gradlew syncVersionJson
 */
tasks.register("syncVersionJson") {
    group = "versioning"
    description = "Sync version.json promos (and stub changelog) from gradle.properties"
    doLast {
        def root = new groovy.json.JsonSlurper().parse(versionJsonFile) as Map
        def mc = project.minecraft_version as String
        def mv = project.mod_version as String
        def expected = "${mc}-${mv}"
        def changed = false

        if (!root.containsKey(mc) || !(root[mc] instanceof Map)) {
            def reordered = new LinkedHashMap()
            root.each { k, v ->
                if (k != "promos") {
                    reordered[k] = v
                }
            }
            reordered[mc] = new LinkedHashMap()
            if (root.promos != null) {
                reordered.promos = root.promos
            } else {
                reordered.promos = new LinkedHashMap()
            }
            root = reordered
            changed = true
        }

        def mcMap = root[mc] as Map
        if (!mcMap.containsKey(mv)) {
            def stub = [summary: "", added: [], changed: [], removed: []] as LinkedHashMap
            def reorderedMc = new LinkedHashMap()
            reorderedMc[mv] = stub
            mcMap.each { k, v -> reorderedMc[k] = v }
            root[mc] = reorderedMc
            changed = true
            logger.lifecycle("Stubbed empty changelog for ${mc}/${mv} in version.json")
        }

        if (!(root.promos instanceof Map)) {
            root.promos = new LinkedHashMap()
            changed = true
        }
        def promos = root.promos as Map
        if (promos.latest != expected) {
            promos.latest = expected
            changed = true
        }
        if (promos.recommended != expected) {
            promos.recommended = expected
            changed = true
        }

        if (changed) {
            versionJsonFile.text = project.prettyPrintJsonTwoSpace(root) + "\n"
            logger.lifecycle("Updated version.json promos to ${expected}")
        } else {
            logger.lifecycle("version.json already in sync with gradle.properties (${expected})")
        }
    }
}

/**
 * Fails when version.json promos or the current changelog entry do not match
 * minecraft_version / mod_version from gradle.properties.
 */
tasks.register("checkVersionSync") {
    group = "verification"
    description = "Fail if version.json is out of sync with gradle.properties"
    doLast {
        if (!versionJsonFile.exists()) {
            throw new GradleException("Missing version.json")
        }
        def root = new groovy.json.JsonSlurper().parse(versionJsonFile) as Map
        def mc = project.minecraft_version as String
        def mv = project.mod_version as String
        def expected = "${mc}-${mv}"

        if (!(root[mc] instanceof Map) || !((root[mc] as Map).containsKey(mv))) {
            throw new GradleException(
                    "version.json is missing changelog for ${mc}/${mv}. " +
                            "Run ./gradlew syncVersionJson and fill in summary/added/changed/removed."
            )
        }
        def entry = (root[mc] as Map)[mv]
        def summary = entry instanceof Map ? entry.summary : null
        if (!(summary instanceof String) || summary.trim().isEmpty()) {
            throw new GradleException(
                    "version.json changelog for ${mc}/${mv} is missing a non-blank summary. " +
                            "Fill in summary for Discord/GitHub/Modrinth release notes."
            )
        }
        def promos = root.promos instanceof Map ? root.promos as Map : null
        if (promos == null || promos.latest != expected || promos.recommended != expected) {
            throw new GradleException(
                    "version.json promos out of sync with gradle.properties. " +
                            "Expected latest/recommended=${expected}, " +
                            "found latest=${promos?.latest}, recommended=${promos?.recommended}. " +
                            "Run ./gradlew syncVersionJson."
            )
        }
    }
}

tasks.named("check").configure {
    dependsOn("checkVersionSync")
}

ext.prettyPrintJsonTwoSpace = { Object data ->
    def pretty = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
    // Groovy Matcher.replaceAll may pass the full match as String or as List(group0, …)
    return pretty.replaceAll(/(?m)^(    )+/) { Object match ->
        String indent = match instanceof List ? match[0].toString() : match.toString()
        "  " * (indent.length() / 4)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    // Require/provision JDK 25 so Gradle does not silently compile/run against an older JVM
    // (Minecraft 26.2 is Java 25 bytecode / class file major version 69).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

// Fabric ModelProvider auto-emits item models for every BlockItem; hand-maintained items
// (roundels, sonic, TARDIS, …) live under src/client/resources. Keep only datagen-owned
// Gallifrey / wood-family / citadel / orange-sand item models in generated
// (ash covers dark_ash via substring; orange_sand covers cut_/chiseled_/smooth_orange_sandstone;
// Gallifrey plant IDs lack a shared "gallifrey" prefix so they are listed explicitly;
// azbantium / stattenheim / broakir / flutterwing cover those standalone items).
tasks.register("pruneDatagenItemModels") {
    group = "fabric"
    description = "Remove generated item models that duplicate hand-maintained client assets"
    doLast {
        def itemsDir = file("src/main/generated/assets/dwm/items")
        if (!itemsDir.directory) {
            return
        }
        itemsDir.eachFile { f ->
            if (f.name.contains("gallifrey")
                    || f.name.contains("ash")
                    || f.name.contains("cardinal")
                    || f.name.contains("citadel")
                    || f.name.contains("orange_sand")
                    || f.name.contains("flower_of_remembrance")
                    || f.name.contains("moonlight_bloom")
                    || f.name.contains("saccharine_cane")
                    || f.name.contains("azbantium")
                    || f.name.contains("stattenheim")
                    || f.name.contains("broakir")
                    || f.name.contains("flutterwing")) {
                return
            }
            f.delete()
        }
    }
}

tasks.named("runDatagen").configure {
    finalizedBy("pruneDatagenItemModels")
}

test {
    useJUnitPlatform()
}
