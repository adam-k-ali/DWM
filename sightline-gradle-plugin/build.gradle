plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
}

group = 'com.adamkali.sightline'
version = '1.0.0'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    // Compile against Loom API when available; plugin detects at runtime.
    compileOnly 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

gradlePlugin {
    plugins {
        sightline {
            id = 'com.adamkali.sightline'
            implementationClass = 'com.adamkali.sightline.gradle.SightlinePlugin'
            displayName = 'Sightline'
            description = 'Real-client Minecraft scenario tests with CI screenshots'
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
