name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-dwm:
    name: Build DWM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DWM
        working-directory: dwm
        run: |
          chmod +x ./gradlew
          ./gradlew build
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload DWM test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dwm-test-results
          path: |
            dwm/build/test-results/test/
            dwm/build/reports/tests/test/
          if-no-files-found: ignore

  build-screenplay:
    name: Build Screenplay
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Screenplay Fabric + common tests
        working-directory: screenplay
        run: |
          chmod +x ./gradlew
          ./gradlew build
          ./gradlew :common:test
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Test Gradle plugin publication metadata
        working-directory: screenplay
        run: |
          ./gradlew -p gradle-plugin test
          ./gradlew -p gradle-plugin pluginDescriptors generatePomFileForPluginMavenPublication
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Build Screenplay Forge / NeoForge
        working-directory: screenplay
        run: |
          ./gradlew -p loaders :forge:build :neoforge:build
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload Screenplay test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenplay-test-results
          path: |
            screenplay/common/build/test-results/test/
            screenplay/common/build/reports/tests/test/
            screenplay/gradle-plugin/build/test-results/test/
            screenplay/gradle-plugin/build/reports/tests/test/
          if-no-files-found: ignore
