name: Sync Modrinth Screenplay

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Modrinth Screenplay project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_modrinth_listing.py \
            --project-id RdazTKdM \
            --meta screenplay/metadata/modrinth.json \
            --body screenplay/metadata/modrinth-body.md
