name: Scenario Tests

on:
  push:

concurrency:
  group: scenario-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - createWorld
          - placeBlock
          - joinVanillaServer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XVFB and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11-xserver-utils \
            libgl1-mesa-dri \
            libgl1 \
            libasound2 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run scenario (${{ matrix.scenario }})
        run: |
          chmod +x ./gradlew
          ./gradlew runScenarioTest \
            -Pscenario=${{ matrix.scenario }} \
            -PscenarioDisplay=xvfb \
            -PscenarioTimeout=120
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}
          path: |
            build/scenario-test/report.xml
            build/scenario-test/diagnostics.txt
            build/scenario-test/run/screenshots/
            build/scenario-test/vanilla-server/logs/
          if-no-files-found: ignore
