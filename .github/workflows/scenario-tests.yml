name: Sightline Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: scenario-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XVFB and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11-xserver-utils \
            libgl1-mesa-dri \
            libgl1 \
            libasound2t64 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all Sightline tests
        run: |
          chmod +x ./gradlew
          ./gradlew runSightlineTests \
            -PsightlineDisplay=xvfb \
            -PsightlineTimeout=120
        env:
          _JAVA_OPTIONS: -Xmx3200m
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sightline-tests
          path: |
            build/sightline/results/
            build/sightline/report.xml
            build/sightline/metrics.json
            build/sightline/diagnostics.txt
            build/sightline/run/screenshots/
            build/sightline/vanilla-server/logs/
          if-no-files-found: ignore

  compare-perf:
    name: Compare Sightline performance
    needs: scenario
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current Sightline artifacts
        uses: actions/download-artifact@v4
        with:
          path: perf/current
          pattern: sightline-*
          merge-multiple: false

      - name: Download latest green main baseline artifacts
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p perf/baseline
          echo '_none yet_' > perf/baseline-label.txt
          RUN_JSON="$(gh run list \
            --workflow=scenario-tests.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId,url)"
          RUN_ID="$(echo "$RUN_JSON" | jq -r '.[0].databaseId // empty')"
          RUN_URL="$(echo "$RUN_JSON" | jq -r '.[0].url // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful main Sightline Tests run found yet."
            exit 0
          fi
          printf 'run [#%s](%s) on `main`\n' "$RUN_ID" "$RUN_URL" > perf/baseline-label.txt
          gh run download "$RUN_ID" -D perf/baseline || true

      - name: Compare metrics (advisory)
        run: |
          python3 .github/scripts/compare-scenario-perf.py \
            --current-dir perf/current \
            --baseline-dir perf/baseline \
            --markdown-out perf/comment.md \
            --baseline-label "$(cat perf/baseline-label.txt)"

      - name: Upsert PR performance comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dwm-sightline-perf -->';
            const body = fs.readFileSync('perf/comment.md', 'utf8');
            if (!body.includes(marker)) {
              throw new Error('compare output missing marker ' + marker);
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing Sightline perf comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created Sightline perf comment ${created.data.id}`);
            }
