name: Sync Modrinth Project

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Modrinth project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_modrinth_listing.py \
            --project-id CY3ponKT \
            --meta dwm/metadata/modrinth.json \
            --body dwm/metadata/modrinth-body.md \
            --require-discord
