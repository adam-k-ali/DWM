# Shared Minecraft / Fabric / Screenplay versions for the monorepo.
# Keep dwm/gradle.properties, screenplay/gradle.properties, and
# screenplay/loaders/gradle.properties aligned with these values.

[versions]
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-loom = "1.17-SNAPSHOT"
fabric-api = "0.156.0+26.2"
screenplay = "1.0.0+26.2"
forge = "65.1.2"
neoforge = "26.2.0.66"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
screenplay-fabric = { module = "com.adamkali.screenplay:screenplay-fabric", version.ref = "screenplay" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
screenplay = { id = "com.adamkali.screenplay" }
