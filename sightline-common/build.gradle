plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.sightline_version
group = project.sightline_maven_group

base {
    archivesName = 'sightline-common'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "org.yaml:snakeyaml:2.6"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testImplementation "org.yaml:snakeyaml:2.6"
    testImplementation "org.json:json:20240303"
}

loom {
    accessWidenerPath = rootProject.file('sightline-fabric/src/main/resources/sightline.accesswidener')
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'sightline-common'
            from components.java
        }
    }
    repositories {
    }
}
