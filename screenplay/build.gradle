plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.adamkali.screenplay'
}

version = project.screenplay_version
group = project.screenplay_maven_group

base {
    archivesName = 'screenplay-fabric'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "org.yaml:snakeyaml:2.6"
    include "org.yaml:snakeyaml:2.6"
}

loom {
    accessWidenerPath = file('src/main/resources/screenplay.accesswidener')

    mods {
        screenplay {
            sourceSet sourceSets.main
        }
    }

    runs {
        screenplayClient {
            client()
            name "Screenplay"
            runDir "build/screenplay/run"
        }
    }
}

screenplay {
    loader = 'fabric'
    testsDir = file('common/src/main/resources/tests')
    runDir = 'build/screenplay/run'
    outputDir = 'screenplay'
}

// Embed common sources so consumers depend on a single loader artifact.
sourceSets.main {
    java {
        srcDir project(':common').file('src/main/java')
    }
    resources {
        srcDir project(':common').file('src/main/resources')
    }
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from(rootProject.file('../LICENSE')) {
        rename { "${it}_screenplay" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'screenplay-fabric'
            from components.java
        }
    }
    repositories {
    }
}
