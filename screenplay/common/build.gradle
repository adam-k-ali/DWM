plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.screenplay_version
group = project.screenplay_maven_group

base {
    archivesName = 'screenplay-common'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "org.yaml:snakeyaml:2.6"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testImplementation "org.yaml:snakeyaml:2.6"
    testImplementation "org.json:json:20260814"
}

loom {
    accessWidenerPath = rootProject.file('src/main/resources/screenplay.accesswidener')
}

// Library module: do not expose usable Loom run tasks (avoids colliding with root runClient).
tasks.configureEach { task ->
    if (task.name in ['runClient', 'runServer', 'runDatagen', 'runGametest']) {
        task.enabled = false
        task.group = null
        task.description = "Disabled on :common (use the Screenplay root project)."
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'screenplay-common'
            from components.java
        }
    }
    repositories {
    }
}
