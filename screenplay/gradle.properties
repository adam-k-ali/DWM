# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
# Fabric Properties — keep aligned with ../gradle/libs.versions.toml
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21
fabric_version=0.161.0+26.3
# Screenplay
screenplay_version=1.0.0+26.3
screenplay_maven_group=com.adamkali.screenplay
# This Gradle project *is* screenplay-fabric — do not depend on itself.
screenplay.addHarnessDependency=false
